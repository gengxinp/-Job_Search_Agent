name: Weekly Job Search

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

jobs:
  weekly-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore job tracker database
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: job-tracker-${{ github.run_id }}
          restore-keys: |
            job-tracker-

      - name: Restore resume
        env:
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
        run: |
          mkdir -p data/resume
          printf '%s' "$RESUME_TEXT" > "data/resume/resume.txt"

      - name: Run weekly job search
        run: python run_weekly.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

      - name: Save job tracker database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: job-tracker-${{ github.run_id }}